[project]
name = "chaukanna-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Serves the AgentCore Runtime container contract (port 8080, /ws, /ping) so we do not
    # reimplement a handshake AWS already specifies. See chaukanna_agent/server.py.
    "bedrock-agentcore>=1.23.1",
    "boto3>=1.43.98",
    "pydantic>=2.11",
    "strands-agents[bidi]>=1.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chaukanna_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
local = [
    "sounddevice>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
