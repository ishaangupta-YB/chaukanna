[project]
name = "chaukanna-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.98",
    "pydantic>=2.11",
    "strands-agents[bidi]>=1.56.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
local = [
    "sounddevice>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
