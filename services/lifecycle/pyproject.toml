[project]
name = "chaukanna-lifecycle"
version = "0.1.0"
requires-python = ">=3.12"
# boto3 alone, and deliberately: this package IS the Lambda's deployment asset. Nothing installs
# into it at deploy time, and the Python 3.12 runtime provides boto3 and botocore but nothing
# else, so a dependency added here would import fine in tests and fail at cold start.
dependencies = [
    "boto3>=1.43.98",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
