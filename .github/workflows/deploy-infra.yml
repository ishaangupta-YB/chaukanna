name: deploy-infra
on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/deploy-infra.yml']
  workflow_dispatch:

permissions:
  id-token: write        # required for OIDC
  contents: read

jobs:
  # `secrets` is not available in a job-level `if:`, so the presence of the deploy role is turned
  # into a job output here and the deploy job gates on that instead. Without this, a repository
  # that has not run scripts/setup-github-oidc.sh gets a red run on every push to main, failing at
  # the credentials step with nothing to learn from it.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -n "$ROLE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Infrastructure deploy skipped"
              echo
              echo "The repository secret \`AWS_ROLE_TO_ASSUME\` is not set, so there is no role to"
              echo "assume and nothing was deployed. This is a clean skip, not a failure."
              echo
              echo "To enable deploys from CI, run \`scripts/setup-github-oidc.sh\` against the target"
              echo "account, then set \`AWS_ROLE_TO_ASSUME\` to the ARN it prints."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      # An OIDC denial says only "Not authorized to perform sts:AssumeRoleWithWebIdentity" and
      # never which subject was presented, which cost this repository a day: GitHub issues the
      # id-bearing form `repo:<org>@<orgId>/<repo>@<repoId>:ref:...` and the trust policy listed
      # only `repo:<org>/<repo>:*`. Printing the claim on failure turns that into one glance.
      - name: Explain the OIDC denial
        if: failure() && steps.creds.outcome == 'failure'
        run: |
          DECODE='import base64,json,sys; t=json.load(sys.stdin)["value"].split(".")[1]; print(json.loads(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)))["sub"])'
          SUB=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
                | python3 -c "$DECODE")
          {
            echo "### Could not assume the deploy role"
            echo
            echo "GitHub presented this OIDC subject:"
            echo
            echo '```'
            echo "$SUB"
            echo '```'
            echo
            echo "The trust policy on \`AWS_ROLE_TO_ASSUME\` must have a \`sub\` pattern matching it."
            echo "Re-run \`scripts/setup-github-oidc.sh ${{ github.repository }}\` to write both forms."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      # Named stack, never `--all`. ChaukannaVoiceStack creates the AgentCore runtime only when
      # AGENT_IMAGE names an image that already exists in ECR, so deploying it from here — where
      # that variable is never set — would synth the stack without a runtime and CloudFormation
      # would delete the live one. The voice stack is deployed from deploy-agent.yml, which builds
      # the image first, or by hand as handoffs/phase3_agent_handoff.md describes.
      - run: npx cdk deploy ChaukannaStack --require-approval never
        working-directory: infra
