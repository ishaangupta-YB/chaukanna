name: deploy-agent
on:
  push:
    branches: [main]
    paths: ['apps/agent/**', '.github/workflows/deploy-agent.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # See the note in deploy-infra.yml: `secrets` cannot be read in a job-level `if:`, so the
  # presence of the deploy role becomes a job output and the deploy job gates on that.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -n "$ROLE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Agent deploy skipped"
              echo
              echo "The repository secret \`AWS_ROLE_TO_ASSUME\` is not set, so there is no role to"
              echo "assume and nothing was deployed. This is a clean skip, not a failure."
              echo
              echo "To enable deploys from CI, run \`scripts/setup-github-oidc.sh\` against the target"
              echo "account, then set \`AWS_ROLE_TO_ASSUME\` to the ARN it prints."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v7
      - id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-1
      # See the same step in deploy-infra.yml: an OIDC denial never names the subject it presented,
      # so print it rather than guess at the trust policy a second time.
      - name: Explain the OIDC denial
        if: failure() && steps.creds.outcome == 'failure'
        run: |
          DECODE='import base64,json,sys; t=json.load(sys.stdin)["value"].split(".")[1]; print(json.loads(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)))["sub"])'
          SUB=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
                | python3 -c "$DECODE")
          {
            echo "### Could not assume the deploy role"
            echo
            echo "GitHub presented this OIDC subject:"
            echo
            echo '```'
            echo "$SUB"
            echo '```'
            echo
            echo "The trust policy on \`AWS_ROLE_TO_ASSUME\` must have a \`sub\` pattern matching it."
            echo "Re-run \`scripts/setup-github-oidc.sh ${{ github.repository }}\` to write both forms."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      # Pinned to an exact release, unlike the others: astral-sh stopped publishing floating major
      # tags after v7, so `@v10` resolves to nothing and the job fails at "Set up job" before a
      # single step runs.
      - uses: astral-sh/setup-uv@v10.1.0
      - run: npm i -g @aws/agentcore
      - run: uv sync --frozen
      - run: uv run pytest -q          # fixture replay gates the deploy
      - run: agentcore create --name chaukanna-drill --dockerfile Dockerfile --entrypoint chaukanna_agent.server:app --region ap-northeast-1 --non-interactive
      - run: agentcore deploy --target chaukanna-drill -y
